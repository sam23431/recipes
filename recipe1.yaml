# ============================================================================
#  QBCore Full Server Recipe (curated, verified open-source resources)
#  Framework: QBCore + ox + Project Sloth | In-game admin: ps-adminmenu
#
#  NOTES:
#  - Every download_github has an explicit `ref` (branch) to avoid GitHub
#    401/403 API limits that hit recipes with >30 ref-less clones.
#  - Conflicting systems (phone/housing/fuel/admin) resolved by ensuring ONE
#    of each; alternatives are downloaded but commented in server.cfg.
#  - Repo names verified against github.com/qbcore-framework (only existing
#    ones are included). To grow the server, copy any [category]/resource
#    block and add an `ensure` line at the bottom.
# ============================================================================

$engine: 3
$onesync: on
name: "QBCore Server Curated"
version: "1.0.0"
author: "opencode"
description: "QBCore + ox + Project Sloth, curated reliable open-source resources with ps-adminmenu in-game admin panel."

tasks:
  # ===================== БАЗА / DEFAULT RESOURCES =====================
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  - action: connect_database

  # ===================== CORE / ЯДРО =====================
  - action: download_github
    src: https://github.com/qbcore-framework/qb-core
    ref: main
    dest: ./resources/[qb]/qb-core

  - action: query_database
    file: ./resources/[qb]/qb-core/qbcore.sql

  # oxmysql / ox_lib / ox_inventory (releases - стабильнее клона)
  - action: download_file
