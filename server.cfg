# txAdmin при импорте рецепта автоматически добавит ensure для каждого ресурса.

# =================== ДОПОЛНИТЕЛЬНЫЕ КОМАНДЫ ===============
# Включение/отключение определённых функций
setr enable_npwd true
setr npwd:useResourceIntegration true

# Настройка pma-voice (если требуется)
setr pma_voice_mode 1

# Настройка ox_inventory (если требуется)
setr ox_inventory:weaponDurability false
setr ox_inventory:itemDurability false

# =================== ЛОГИРОВАНИЕ ==========================
set sv_enforceGameBuild 0
set sv_enforceGameBuild 0
set sv_lan 0
set sv_cheats 0
set sv_scriptHookAllowed 0
set sv_maxPing 200
set sv_timeout 120

# =================== РАЗРЕШЕНИЯ И БЕЗОПАСНОСТЬ ============
add_principal identifier.steam:steamid group.admin
add_ace group.admin command allow
add_ace group.admin command.quit deny

# =================== КОНЕЦ ФАЙЛА ==========================
