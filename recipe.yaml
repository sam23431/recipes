      ensure ps-discord
      # ensure ps-fuel   # (закомментировано: конфликтует с ox_fuel, раскомментируй и отключи ox_fuel при желании)

      # ===== QBCORE РЕСУРСЫ =====
      ensure qb-target
      ensure qb-menu
      ensure qb-input
