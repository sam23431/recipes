###############################################################
#                GTA5 FiveM Server Config (QBCore)
###############################################################

# =================== ОСНОВНЫЕ НАСТРОЙКИ ===================
sv_licenseKey "your_license_key_here"
sv_hostname "My QBCore Server"
sv_projectName "My QBCore Project"
sv_projectDesc "QBCore RP Server with many mods"
sv_maxclients 64
sv_scriptHookAllowed 0

# =================== ONESYNC ================================
onesync on
onesync_enableInfinity 1
onesync_enableBeyond 1
onesync_population 1

# =================== БАЗА ДАННЫХ (MySQL) ===================
set mysql_connection_string "mysql://your_db_user:your_db_password@localhost/your_db_name?charset=utf8mb4"
set mysql_slow_query_warning 150

# =================== ОБЩИЕ НАСТРОЙКИ ======================
setr steam_webApiKey "none"
setr tags "roleplay,qbcore,esx,fivem"
setr discord "https://discord.gg/yourserver"
setr banner_connecting "https://i.imgur.com/yourbanner.png"
setr banner_detail "Loading..."
setr language "en"
setr locale "en-US"

# =================== ГОЛОСОВОЙ ЧАТ =========================
ensure pma-voice

# =================== СИСТЕМА ОЧИСТКИ =======================
