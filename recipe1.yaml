      ensure ps-hud
      ensure ps-adminmenu
      ensure ps-dispatch
      ensure ps-buffs
      ensure ps-housing
      ensure ps-mdt
      ensure ps-discord
      # ensure ps-fuel   # (закомментировано: конфликтует с ox_fuel, раскомментируй и отключи ox_fuel при желании)

      # ===== ЗАВИСИМОСТИ =====
      ensure connectqueue
      ensure progressbar
      ensure PolyZone

      # ===== QBCORE РЕСУРСЫ =====
