$engine: 3
$onesync: on
name: "QBCore Full Server 300+ Mods"
version: "1.0.0"
author: "YourName"
description: "QBCore Framework + огромное количество ресурсов"

tasks:
  # ==================== БАЗА ====================
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  - action: connect_database

  # ==================== QBCORE ЯДРО ====================
  - action: download_github
    src: https://github.com/qbcore-framework/qb-core
    ref: main
    dest: ./resources/[qb]/qb-core

  - action: query_database
    file: ./resources/[qb]/qb-core/sql/legacy.sql

  # ==================== OX СИСТЕМЫ ====================
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]/oxmysql

  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]/ox_lib

  - action: download_file
    url: https://github.com/overextended/ox_inventory/releases/latest/download/ox_inventory.zip
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]/ox_inventory

  - action: download_github
    src: https://github.com/overextended/ox_target
    ref: main
    dest: ./resources/[ox]/ox_target

  - action: download_github
    src: https://github.com/overextended/ox_doorlock
    ref: main
    dest: ./resources/[ox]/ox_doorlock

  - action: download_github
    src: https://github.com/overextended/ox_fuel
    ref: main
    dest: ./resources/[ox]/ox_fuel

  # ==================== ОСНОВНЫЕ QB РЕСУРСЫ ====================
