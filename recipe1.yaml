      ensure qb-streetraces
      ensure qb-lapraces
      ensure qb-truckrobbery
      ensure qb-weed
      ensure qb-vineyard
      ensure qb-prison
      ensure qb-anticheat
      ensure qb-crafting
      ensure qb-minigames
      ensure qb-loading
      ensure qb-weapons
      ensure qb-vehiclekeys

      # АЛЬТЕРНАТИВЫ (раскомментируй одну из пар, отключив конфликтующую):
      # ensure qb-adminmenu   # (альтернатива ps-adminmenu)

      # ===== КАРТЫ / ИНТЕРЬЕРЫ =====
      ensure bob74_ipl

      # ===== ТРАНСПОРТ =====
      # (пакам машин ~6ГБ убраны: таймаут при деплое; добавь свои авто-паки и раскомментируй ensure)

      # ===== EUP / ОДЕЖДА =====
      ensure eup_stream
      ensure eup_law

      # ===== ОРУЖИЕ =====
      ensure weapon_pack
