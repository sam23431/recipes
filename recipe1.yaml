  # ===================== SERVER.CFG =====================
  - action: write_file
    file: ./server.cfg
    data: |
      # ===== БАЗОВАЯ КОНФИГУРАЦИЯ =====
      set sv_hostname "{{serverName}}"
      set sv_licenseKey "{{svLicense}}"
      set sv_maxclients {{maxClients}}

      # ===== MYSQL (qb-core / oxmysql) =====
      set mysql_connection_string "mysql://{{dbUsername}}:{{dbPassword}}@{{dbHost}}:{{dbPort}}/{{dbName}}"

      # ===== ОПЦИОНАЛЬНО: Steam / Web API (раскомментируй при необходимости) =====
      # set steam_webApiKey ""
      # setr voice_useNativeAudio false
      # setr voice_mumbleConfigName mumble_definitions.json

      # ===== СИСТЕМНЫЕ РЕСУРСЫ (cfx-default) =====
      ensure mapmanager
      ensure spawnmanager
      ensure sessionmanager
      ensure fivem
      ensure hardcap
      ensure rconlog
      ensure scoreboard
      ensure playernames
      ensure baseevents
      ensure performance

      # ===== CORE (порядок важен: oxmysql -> ox_lib -> qb-core) =====
      ensure oxmysql
      ensure ox_lib
      ensure qb-core
      ensure ox_inventory
      ensure ox_target
      ensure ox_doorlock
      ensure ox_fuel

      # ===== ГОЛОС / ТЕЛЕФОН / ВНЕШНИЙ ВИД =====
      ensure pma-voice
      ensure npwd
      ensure illenium-appearance
      ensure monolith-clothingmenu

      # ===== PROJECT SLOTH (в т.ч. админ-панель ps-adminmenu) =====
