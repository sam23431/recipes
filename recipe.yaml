      ensure qb-cocaine
      ensure qb-meth
      ensure qb-bankrobbery
      ensure qb-jewelry
      ensure qb-pawnshop
      ensure qb-mining
      ensure qb-fishing
      ensure qb-hunting
      ensure qb-lumberjack
